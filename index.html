    <!-- GitHub Pages Subdirectory & SPA Routing Fix -->
    <script type="text/javascript">
      // 1. Ensure trailing slash on subdirectory URLs (e.g. username.github.io/repo -> username.github.io/repo/)
      // This prevents 404 MIME type errors when loading relative ./assets/ scripts.
      (function() {
        var p = window.location.pathname;
        if (p && p.indexOf('.') === -1 && !p.endsWith('/')) {
          var target = p + '/' + window.location.search + window.location.hash;
          window.location.replace(target);
          return;
        }
      })();

      // 2. Decode SPA redirected paths from public/404.html (spa-github-pages)
      (function(l) {
        if (l.search[1] === '/' || l.search.indexOf('?p=/') !== -1 || l.search.indexOf('&p=/') !== -1) {
          var params = new URLSearchParams(l.search);
          var p = params.get('p');
          if (p) {
            params.delete('p');
            var newSearch = params.toString() ? '?' + params.toString() : '';
            var repoBase = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
            var cleanPath = p.startsWith('/') ? p : '/' + p;
            window.history.replaceState(null, null, repoBase + cleanPath + newSearch + l.hash);
          }
        }
      })(window.location);
    </script>
